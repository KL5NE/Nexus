name: WWV Phase 0 baseline (unmodified Nexus)
on:
  push:
    branches: [feature/wwv-time-tab]
    paths:
      - 'docs/wwv/**'
      - '.github/workflows/wwv-phase0-baseline.yml'
      - 'crates/tempo-fast-sys/build.rs'
  workflow_dispatch:
jobs:
  rust-windows:
    name: Rust / Windows baseline (manual diagnostics)
    # These upstream baseline checks have confirmed unresolved native libvpx and Logbook issues.
    # Keep the evidence available on demand without marking each passing cross-build red.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: MSYS2 native Fortran / FFTW / Boost / pkg-config
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
      - name: Use actual MSYS2 installation path
        shell: pwsh
        run: |
          $msysRoot = '${{ steps.msys2.outputs.msys2-location }}'
          $mingw = Join-Path $msysRoot 'mingw64'
          $bin = Join-Path $mingw 'bin'
          if (-not (Test-Path $bin)) { throw "MSYS2 bin missing: $bin" }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append
          "MINGW_ROOT=$mingw" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-Date -Format o
      - name: Prefer MinGW Makefiles for native Fortran build
        shell: pwsh
        run: |
          $make = Join-Path (Join-Path $env:MINGW_ROOT 'bin') 'mingw32-make.exe'
          if (-not (Test-Path $make)) { throw "MinGW make missing: $make" }
          "CMAKE_GENERATOR=MinGW Makefiles" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CMAKE_MAKE_PROGRAM=$make" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Output "Use MinGW Makefiles to avoid Ninja Fortran preprocessing paths (//?/D:/...) seen in prior CI."
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Toolchain diagnostics
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          $bin = Join-Path $env:MINGW_ROOT 'bin'
          $pc = Join-Path $bin 'pkgconf.exe'
          if (-not (Test-Path $pc)) { $pc = Join-Path $bin 'pkg-config.exe' }
          if (-not (Test-Path $pc)) { throw "MSYS2 pkg-config binary missing in $bin" }
          $libpc = Join-Path (Join-Path $env:MINGW_ROOT 'lib') 'pkgconfig'
          if (-not (Test-Path (Join-Path $libpc 'fftw3f.pc'))) { throw "MSYS2 FFTW3f .pc file missing in $libpc" }
          $env:PKG_CONFIG = $pc
          $env:PKG_CONFIG_LIBDIR = $libpc
          $env:PKG_CONFIG_PATH = $libpc
          "PKG_CONFIG=$pc" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PKG_CONFIG_LIBDIR=$libpc" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PKG_CONFIG_PATH=$libpc" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $pc --modversion fftw3f
          & (Join-Path $bin 'gfortran.exe') --version
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Isolated native libtempo compile check
        run: cargo check -p tempo-fast-sys
      # MSVC's link.exe cannot consume MinGW libgfortran (-lgfortran resolves
      # to gfortran.lib). Compile test targets without linking until the supported
      # Windows GNU target or cross-build is provisioned for runtime tests.
      - name: Isolated native libtempo test-target compilation (no MSVC link)
        run: cargo check -p tempo-fast-sys --tests
      - name: Windows workspace dependency preflight (pinned libvpx)
        shell: pwsh
        run: |
          $prefix = if ($env:VPX_MINGW_PREFIX) { $env:VPX_MINGW_PREFIX } else { Join-Path $env:GITHUB_WORKSPACE 'target/vpx-mingw' }
          $archive = Join-Path $prefix 'lib/libvpx.a'
          $headers = Join-Path $prefix 'include/vpx'
          if (-not ((Test-Path $archive) -and (Test-Path $headers))) {
            Write-Warning "Full workspace compilation requires pinned static libvpx. Missing $archive or $headers. The supported cross-build script is scripts/build-windows-cross.sh; this native CI runner has not provisioned that dependency."
          } else {
            Write-Output "Pinned libvpx available at $prefix"
          }
      - name: Native Windows workspace compile baseline (independent of upstream Clippy lints)
        run: cargo check --workspace --all-targets
      - name: Clippy (baseline with one documented upstream warning)
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::unnecessary_sort_by
      - name: Diagnose generated MinGW Makefiles after native failure
        if: failure()
        shell: pwsh
        run: |
          $buildDirs = Get-ChildItem 'target/debug/build' -Directory -Filter 'tempo-fast-sys-*' -ErrorAction SilentlyContinue
          foreach ($dir in $buildDirs) {
            $out = Join-Path $dir.FullName 'out'
            $cache = Join-Path $out 'CMakeCache.txt'
            $makefile = Join-Path $out 'CMakeFiles/tempo_static.dir/build.make'
            if (Test-Path $cache) {
              Write-Output "=== CMake generator and source directory ($cache) ==="
              Select-String -Path $cache -Pattern '^CMAKE_GENERATOR:','^CMAKE_HOME_DIRECTORY:','^CMAKE_MAKE_PROGRAM:' | ForEach-Object { $_.Line }
            }
            if (Test-Path $makefile) {
              Write-Output "=== Generated build.make lines 65-90 ($makefile) ==="
              $lines = Get-Content $makefile
              for ($i=64; $i -lt [Math]::Min(90,$lines.Count); $i++) {
                Write-Output ("{0}: {1}" -f ($i+1), $lines[$i])
              }
              Write-Output "=== Relevant path tokens ==="
              Select-String -Path $makefile -Pattern '\\\\?\\','//?/','tempodeep','^D:' | Select-Object -First 12 | ForEach-Object { $_.Line }
            }
          }
      - name: Rust workspace tests
        run: cargo test --workspace
      - name: End and instructions
        if: always()
        shell: pwsh
        run: |
          Get-Date -Format o
          Write-Output "Baseline-only checks: no WWV integration, installer, or HAMBEAST runtime test."

  ui-windows:
    name: UI / Windows baseline (manual diagnostics)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI baseline install (temporary lockfile regeneration)
        working-directory: ui
        shell: pwsh
        run: |
          Write-Output "Upstream v1.22.0 package-lock.json is out of sync. Regenerating only in this disposable CI workspace with legacy peer handling."
          Remove-Item package-lock.json -Force
          npm install --legacy-peer-deps --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "UI dependency installation failed" }
          Write-Output "This establishes a diagnostic UI baseline only; lockfile reproducibility remains unresolved."
      - name: TypeScript check
        working-directory: ui
        run: npx tsc -b
      - name: Vitest known-good smoke baseline
        working-directory: ui
        timeout-minutes: 4
        run: npx vitest run src/features/audioError.test.ts --reporter=dot
      - name: Vitest targeted Logbook regression diagnosis
        working-directory: ui
        timeout-minutes: 8
        run: npx vitest run src/components/Logbook.qslMark.test.tsx --reporter=dot

  cross-modem-linux:
    name: Supported Windows GNU cross-build / modem only
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install documented Windows cross-toolchain prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 gfortran-mingw-w64-x86-64 cmake ninja-build nasm pkg-config libboost-dev
      - name: Install Rust Windows GNU target
        run: rustup target add x86_64-pc-windows-gnu
      - name: Run repository-supported modem-only cross-build (no installer or deployment)
        run: bash scripts/build-windows-cross.sh --modem
      - name: Report produced Windows modem binaries
        run: |
          test -s target/x86_64-pc-windows-gnu/release/examples/win_smoke.exe
          ls -lh target/x86_64-pc-windows-gnu/release/examples/win_smoke.exe
          find libtempo/build-win -maxdepth 1 -name '*.exe' -printf '%f %s bytes\n'
