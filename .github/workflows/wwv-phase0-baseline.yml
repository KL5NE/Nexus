name: WWV Phase 0 baseline (unmodified Nexus)
on:
  push:
    branches: [feature/wwv-time-tab]
    paths:
      - 'docs/wwv/**'
      - '.github/workflows/wwv-phase0-baseline.yml'
  workflow_dispatch:
jobs:
  rust-windows:
    name: Rust / Windows baseline
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: MSYS2 native Fortran / FFTW / Boost / pkg-config
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
      - name: Put native toolchain ahead of runner tools
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          Get-Date -Format o
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Toolchain diagnostics
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          cmake --version
          gfortran --version
          # Windows image has Strawberry Perl's pkg-config earlier on PATH.
          # MSYS2's library metadata must be selected explicitly.
          $env:PKG_CONFIG = "C:\\msys64\\mingw64\\bin\\pkg-config.exe"
          $env:PKG_CONFIG_LIBDIR = "C:\\msys64\\mingw64\\lib\\pkgconfig"
          $env:PKG_CONFIG_PATH = "C:\\msys64\\mingw64\\lib\\pkgconfig"
          "PKG_CONFIG=$env:PKG_CONFIG" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PKG_CONFIG_LIBDIR=$env:PKG_CONFIG_LIBDIR" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PKG_CONFIG_PATH=$env:PKG_CONFIG_PATH" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $env:PKG_CONFIG --version
          Get-ChildItem "C:\\msys64\\mingw64\\lib\\pkgconfig" -Filter "*fftw*"
          & $env:PKG_CONFIG --modversion fftw3f
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Clippy (baseline with one documented upstream warning)
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::unnecessary_sort_by
      - name: Rust workspace tests
        run: cargo test --workspace
      - name: End and instructions
        if: always()
        shell: pwsh
        run: |
          Get-Date -Format o
          Write-Output "Baseline-only checks: no WWV integration, installer, or HAMBEAST runtime test."

  ui-windows:
    name: UI / Windows baseline
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Diagnose upstream lockfile mismatch
        working-directory: ui
        shell: pwsh
        run: |
          npm ci *> ci-baseline.log
          if ($LASTEXITCODE -ne 0) {
            Write-Output "UPSTREAM LOCKFILE NOT IN SYNC; npm ci cannot be used without regeneration."
            Get-Content ci-baseline.log | Select-String 'npm error (Missing|Invalid|code)' | Select-Object -First 16
          } else {
            Write-Output "Upstream npm ci succeeded."
          }
      - name: Install UI dependencies without modifying lockfile
        working-directory: ui
        run: npm install --no-save --package-lock=false --no-audit --no-fund
      - name: TypeScript check
        working-directory: ui
        run: npx tsc -b
      - name: Vitest
        working-directory: ui
        run: npx vitest run
