[package]
publish = false
name = "ahr-wwv-sys"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
# GPL-3.0-or-later, not the workspace GPL-3.0-only: the vendored AHR-Decoder
# carries its own per-file "or later" grant (see vendor/ahr-decoder and NOTICE).
